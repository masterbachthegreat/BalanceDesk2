# Builds the Windows installer + portable .exe on every push and attaches them to a
# GitHub Release named after the version in package.json (bump the version for a new release).
name: Build Windows app

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate game data
        run: npm run validate

      - name: Build installer and portable exe
        run: npx electron-builder --win nsis portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BalanceDesk-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: BalanceDesk v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
          body: |
            **Download one of these:**
            - `BalanceDesk-Setup-${{ steps.ver.outputs.version }}.exe`: installer (recommended)
            - `BalanceDesk-Portable-${{ steps.ver.outputs.version }}.exe`: no install, just run it

            Windows may show "Windows protected your PC" because the app isn't code-signed: click **More info → Run anyway**.
            Your saves live in `%APPDATA%\BalanceDesk\save` and are kept when you update.
